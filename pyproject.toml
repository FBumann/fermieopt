[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fermieopt"
version = "0.2.0"
description = "FermIE: Fernwärme-Investitions-und-Einsatzoptimierung. Ein Excel-basiertes Tool zur Optimierung von Fernwärme-Systemen, basierend auf 'flixOpt'."
authors = [
    { name = "Felix Bumann", email = "felixbumann387@gmail.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["optimization", "energy", "district heating", "fernwärme", "excel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "flixOpt @git+https://github.com/flixOpt/flixOpt.git@v1.0.0",
    "pydantic >=2.10.1"
]

[tool.setuptools.package-data]
fermieopt = ["flixOpt_excel/resources/ExcelTemplates/*.xlsx"]

[tool.setuptools.include-package-data]
true
